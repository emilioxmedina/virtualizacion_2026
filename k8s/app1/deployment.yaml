apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-primera
spec:
  replicas: 3
  selector:
    matchLabels:
      app: app-primera
  template:
    metadata:
      labels:
        app: app-primera
    spec:
      containers:
      - name: web
        image: nginx:alpine
        ports:
        - containerPort: 80